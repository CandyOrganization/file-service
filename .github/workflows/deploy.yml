name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          command_timeout: 30m
          script: |
            set -e

            REPO_DIR="$HOME/cluster"
            REPO_URL="https://github.com/CandyOrganization/file-service.git"
            COMPOSE_DIR="$HOME"  # docker-compose.yml лежит в $HOME/cluster

            echo "🚀 Starting deployment at $(date)"

            if [ -d "$REPO_DIR" ]; then
              cd "$REPO_DIR"
              git fetch origin
              git reset --hard origin/master
              git clean -fd
            else
              git clone "$REPO_URL" "$REPO_DIR"
              cd "$REPO_DIR"
            fi

             # Переходим в папку с docker-compose.yml
            cd "$COMPOSE_DIR"

            # Проверяем существование docker-compose.yml
            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ docker-compose.yml not found in $COMPOSE_DIR"
              exit 1
            fi

            # Пересобираем и перезапускаем только file-service
            if [ -f "$HOME/.env" ]; then
              echo "📄 Using .env from $HOME/.env"
              docker compose --env-file "$HOME/.env" up -d --build file-service
            else
              echo "⚠️ No .env file found, proceeding without it"
              docker compose up -d --build file-service
            fi
